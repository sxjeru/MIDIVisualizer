name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cmake-opts: -D CMAKE_C_COMPILER=gcc -D CMAKE_CXX_COMPILER=g++
            artifact_path: build/MIDIVisualizer
            ffmpeg-archive: ffmpeg-ubuntu20-64-static-lgpl.zip
          - os: windows-2025
            cmake-opts: -A x64
            artifact_path: build/Release/MIDIVisualizer.exe
            ffmpeg-archive: ffmpeg-windows-64-static-lgpl.zip
          - os: macos-15
            cmake-opts: -G Xcode
            artifact_path: build/Release/MIDIVisualizer.app
            ffmpeg-archive: ffmpeg-osx-uni64-static-lgpl.zip
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v3

      - name: Dependencies-ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: sudo apt-get update -y && sudo apt-get install -yq xorg-dev libgtk-3-dev libasound2-dev libnotify-dev

      - name: Dependencies-macos
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: brew install wget

      - name: Dependencies-windows
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: choco install wget unzip zip

      - name: Dependencies-ffmpeg
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/libs
          wget -O ffmpeg.zip https://github.com/kosua20/MIDIVisualizer-dependencies/releases/latest/download/${{matrix.ffmpeg-archive}}
          unzip ffmpeg.zip
          rm ffmpeg.zip
          cp ffmpeg/share/ffmpeg/FindFFMPEG.cmake ./

      - name: Configure
        shell: bash
        working-directory: ${{runner.workspace}}
        run: |
          cmake -E make_directory ${{runner.workspace}}/build
          cmake -S $GITHUB_WORKSPACE -B build/ -DCMAKE_BUILD_TYPE=Release ${{matrix.cmake-opts}}

      - name: Build
        working-directory: ${{runner.workspace}}
        shell: bash
        run: cmake --build build/ --config Release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MIDIVisualizer-${{ matrix.os }}
          path: ${{ runner.workspace }}/${{ matrix.artifact_path }}
